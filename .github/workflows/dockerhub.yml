# This workflow will build and push official docker images when new push occurs to develop, master, release branches but doesn't run any unit test or sonar scanner
name: Docker Hub build
on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - master
      - "release/*"
    tags:
      - "carma-system-*"
      - "!carma-system-*-demo*"

jobs:
  dockerhub:
    uses: usdot-fhwa-stol/actions/.github/workflows/dockerhub.yml@main
    # Base autoware.ai image and dependencies are pinned to CARMA System 4.14.0.
    # These override the DOCKER_ORG/DOCKER_TAG/GIT_BRANCH build args the shared workflow derives
    # from the git ref; the pushed image name/tag is still derived from the ref (e.g. release/*).
    with:
      additional_build_args: |
        DOCKER_ORG=usdotfhwastol
        DOCKER_TAG=carma-system-4.14.0
        GIT_BRANCH=carma-system-4.14.0
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
